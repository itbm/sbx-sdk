name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Called by release.yml to test the tagged commit before publishing.
  workflow_call:
    inputs:
      ref:
        description: Git ref to test
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Fern CLI
        run: npm ci

      - name: Validate the OpenAPI spec
        run: make check

      # fern generate --local runs each generator in Docker; ubuntu-latest
      # runners have Docker pre-installed and running.
      - name: Generate SDKs
        run: make generate fix-perms

      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod

      - uses: actions/setup-python@v5
        with:
          # The oldest supported version, where most compatibility bugs show up.
          python-version: "3.9"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: curl, json
          tools: composer

      - name: TypeScript
        run: make test-typescript

      - name: Python
        run: make test-python

      - name: Go
        run: make test-go

      - name: PHP
        run: make test-php
