[project]
name = "sbx-sdk"
version = "0.34.0"
description = "Python client for the sbx daemon HTTP API"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.21.2",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
